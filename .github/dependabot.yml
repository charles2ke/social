# Weekly version updates, grouped to keep the pull request count down.
# Security updates are separate and are not delayed by this schedule.
version: 2
updates:
  - package-ecosystem: npm
    # The root covers every pnpm workspace package (pnpm-workspace.yaml).
    directory: /
    schedule:
      interval: weekly
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
