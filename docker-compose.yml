# Database layer only. This branch's app scaffold (apps/web, MCP server,
# etc.) is being built out separately — once those services exist, add
# `depends_on: { postgres: { condition: service_healthy } }` to each of
# them so `docker compose up` remains a single-command start with no
# manual DB setup. See docs/adr/0001-database.md and README.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-social}
      POSTGRES_DB: ${POSTGRES_DB:-social}
      # Local-dev-only: trust auth avoids needing a password in
      # .env.example. Production deployments must not use trust auth —
      # see .env.example's commented `sslmode=require` example instead.
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-social} -d ${POSTGRES_DB:-social}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Example of how an app service should be wired once it exists:
  #
  # web:
  #   build: ./apps/web
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-social}@postgres:5432/${POSTGRES_DB:-social}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #
  # mcp-server:
  #   build: ./apps/mcp-server
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-social}@postgres:5432/${POSTGRES_DB:-social}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_data:
