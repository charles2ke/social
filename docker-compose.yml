# `docker compose up` is a single-command start: Postgres boots first (with
# packages/db/prisma/init/*.sql applied automatically to create the
# least-privilege social_worker role), then the app waits for it to report
# healthy before starting. See docs/adr/0001-database.md and README.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-social}
      POSTGRES_DB: ${POSTGRES_DB:-social}
      # Local-dev-only: trust auth avoids needing a password in
      # .env.example. Production deployments must not use trust auth —
      # see .env.example's commented `sslmode=require` example instead.
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-social} -d ${POSTGRES_DB:-social}"]
      interval: 5s
      timeout: 5s
      retries: 10

  social:
    build: .
    ports: ["3000:3000", "3001:3001"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-social}@postgres:5432/${POSTGRES_DB:-social}
    depends_on:
      postgres:
        condition: service_healthy

  # The scheduler worker runs as its own process so publishing keeps going
  # independently of the HTTP API, and so it can connect as the
  # least-privilege social_worker role (WORKER_DATABASE_URL).
  worker:
    build: .
    command: ["sh", "-c", "corepack pnpm --filter @social/api run start:worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-social}@postgres:5432/${POSTGRES_DB:-social}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
